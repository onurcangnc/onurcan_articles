<section id="ctf" style="background:var(--cream-2)">
  <div class="sec-label"><span class="sec-num">04</span><h2>CTF &amp; Competitions</h2></div>
  <div class="ctf-list">
    {{ range site.Data.site_data.ctf }}
    <div class="ctf-row">
      <div class="ctf-year">{{ .year }}</div>
      <div class="ctf-name">{{ .name }}</div>
      <div class="ctf-desc">{{ .desc }}</div>
      <span class="ctf-badge {{ .badge_class }}">{{ .badge }}</span>
    </div>
    {{ end }}
  </div>
</section>
