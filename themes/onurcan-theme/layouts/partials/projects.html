<section id="projects" style="background:var(--cream-2)">
  <div class="sec-label"><span class="sec-num">02</span><h2>Selected GitHub Work</h2></div>
  <div class="proj-grid">
    {{ range site.Data.projects }}
    <div class="proj-card">
      <div class="proj-top">
        <span class="proj-name">{{ .name }}</span>
        <span class="proj-cat {{ .cat_class }}">{{ .category }}</span>
      </div>
      <p class="proj-desc">{{ .desc }}</p>
      <div class="proj-tags">{{ range .tags }}<span class="pt">{{ . }}</span>{{ end }}</div>
      <a href="{{ .link }}" target="_blank" class="proj-link">github ↗</a>
    </div>
    {{ end }}
  </div>
  <div class="mt-24 text-center">
    <a href="{{ site.Params.github }}?tab=repositories" target="_blank" class="btn-line">View all repos on GitHub ↗</a>
  </div>
</section>
