<section style="background:#fff">
  <div class="sec-label"><span class="sec-num">05</span><h2>Licenses &amp; Credentials</h2></div>
  <div class="cert-grid">
    {{ range site.Data.site_data.certs }}
    <div class="cert-card">
      <div class="cert-issuer">{{ .issuer }}</div>
      <div class="cert-name">{{ .name }}</div>
      <div class="cert-date">{{ .date }}</div>
    </div>
    {{ end }}
  </div>
</section>
