[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.124.0"
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[build.processing]
  [build.processing.html]
    pretty_urls = true

# ─── Hostname canonicalization ────────────────────────────────────────────────
[[redirects]]
  from = "https://onurcanarticles.netlify.app/*"
  to = "https://onurcangenc.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.onurcangenc.com.tr/*"
  to = "https://onurcangenc.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ─── /blog/* legacy paths (NVD/MITRE reference URLs) ─────────────────────────
[[redirects]]
  from = "/blog/decap-cms-xss-analysis"
  to = "https://blog.onurcangenc.com.tr/cve-2025-57520-stored-xss-in-decap-cms-3-8-3/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/moodle-xss-pdfannotator"
  to = "https://blog.onurcangenc.com.tr/cve-2025-60506-stored-cross-site-scripting-xss-in-moodle-pdf-annotator-plugin-v1-5-release-9/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://blog.onurcangenc.com.tr/"
  status = 301
  force = true

# ─── /posts/* legacy article redirects ────────────────────────────────────────
