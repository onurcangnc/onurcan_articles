  force = true

# Turkish-character slugs
[[redirects]]
  from = "/posts/nucaıscan-*"
  to = "https://blog.onurcangenc.com.tr/"
  status = 301
  force = true

[[redirects]]
  from = "/posts/moodle-geniaı-*"
  to = "https://blog.onurcangenc.com.tr/cve-2025-60507-moodle-geniai-plugin-v2-3-6-xss-via-pdf-upload-prompt-injection/"
