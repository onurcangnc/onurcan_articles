# eWPT guide (no Ghost equivalent)
[[redirects]]
  from = "/posts/img-src-x-onerror-alert-1/"
  to = "https://blog.onurcangenc.com.tr/"
  status = 301
  force = true

# Catch-all: any other /posts/ slug → try exact match on blog
[[redirects]]
  from = "/posts/*"
  to = "https://blog.onurcangenc.com.tr/:splat"
  status = 301
  force = true

